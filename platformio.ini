; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Project Configuration File

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
upload_speed = 115200

build_flags =
	-I include
	; 私有凭据（WiFi / 百度语音 / 心知天气），真实值不在仓库里。
	; 首次拉取代码后先执行：cp include/secrets.example.h include/secrets.h，再填好值。
	-include secrets.h
	-D LV_CONF_INCLUDE_SIMPLE
	-D BOARD_HAS_PSRAM
	-D LV_FONT_MONTSERRAT_20=1

	; ---- ILI9341 显示屏（SPI2，与触摸共用）----
	-D USER_SETUP_LOADED
	-D ILI9341_DRIVER
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=240
	-D TFT_MISO=17
	-D TFT_MOSI=7
	-D TFT_SCLK=15
	-D TFT_CS=4
	-D TFT_DC=6
	-D TFT_RST=5
	-D TFT_BL=16
	-D TOUCH_CS=8
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT
	-D TFT_BACKLIGHT_ON=HIGH

	-D XIAOZHI_LOG_ENABLE=1

	-D I2S_PDM=0
	-D I2S_SCK=11
	-D I2S_WS=13
	-D I2S_SD=12

	-D I2S_DOUT=39
	-D I2S_BCLK=40
	-D I2S_LRC=41

	-D CHECK_FOR_STACK_OVERFLOW=0
	-D configUSE_TRACE_FACILITY=1

	-D SD_CS=10
	-D SD_MOSI=47
	-D SD_MISO=18
	-D SD_SCLK=21

	-D CORE_DEBUG_LEVEL=5

extra_scripts = scripts/patch_minimax.py

lib_deps =
	lvgl/lvgl@8.3.11
	bodmer/TFT_eSPI@2.5.0
	bblanchon/ArduinoJson@^6.21.4
	esphome/ESP32-audioI2S@2.0.6
	plageoj/UrlEncode@^1.0.1
    gilmaimon/ArduinoWebsockets@^0.5.3      	
	https://github.com/CaddonThaw/baidu-xiaozhi.git
	https://github.com/CaddonThaw/lvgl-games.git